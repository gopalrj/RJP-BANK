server:
  port: 8082

spring:
  application:
    name: risk-assessment-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

# In production, the credit bureau's real base URL and API key would live here
# and be injected into CreditBureauClient, e.g.:
# credit-bureau:
#   base-url: https://api.creditbureau.example.com
#   api-key: ${CREDIT_BUREAU_API_KEY}
